/*

========================================

function shuffle(array){
 return array.sort(()=>Math.random()-0.5);
}

const truthCases=shuffle(
 cases.filter(c=>c[7]===true)
).slice(0,5);

const lieCases=shuffle(
 cases.filter(c=>c[7]===false)
).slice(0,5);

let selectedCases=shuffle(
 [...truthCases,...lieCases]
);

let i=0;
let score=0;

========================================

========================================
*/

 const c=selectedCases[i];

 document.getElementById("count").textContent=
 `CASE ${i+1} / ${selectedCases.length}`;

 document.getElementById("case").textContent=
 `入居者：${c[0]}`;

 document.getElementById("info").innerHTML=
 `<div>年齢<b>${c[1]}</b></div>

  <div style="grid-column:1/-1">
  過去の滞納<b>${c[5]}</b></div>`;

 document.getElementById("quote").textContent=c[6];

 document.getElementById("game").style.display="block";
 document.getElementById("result").style.display="none";
 document.getElementById("final").style.display="none";
}


/*
========================================
回答
========================================
*/

function answer(choice){

 const c=selectedCases[i];

 const ok=choice===c[7];

 if(ok){
   score+=10;
 }

 document.getElementById("score").textContent=score;

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 document.getElementById("resultBig").className=
 "big "+(ok?"correct":"wrong");

 document.getElementById("resultBig").textContent=
 ok?"🎯 正解！":"😇 残念！";

 document.getElementById("resultReason").innerHTML=
 `答えは <b>${c[7]?"真実":"嘘"}</b> でした。`;

 document.getElementById("explain").innerHTML=
 `<b>管理会社メモ</b><br>${c[8]}`;

 document.querySelector(".next").textContent=
 i===selectedCases.length-1
 ?"結果を見る →"
 :"次の滞納者へ →";
}


/*
========================================
次の問題
========================================
*/

function next(){

 if(i<selectedCases.length-1){

   i++;
   render();

 }else{

   document.getElementById("result").style.display="none";
   document.getElementById("final").style.display="block";

   document.getElementById("finalScore").textContent=
   score+" / 100";

   document.getElementById("finalText").textContent=

   score===100
   ?"完璧。もう滞納者の声が聞こえる。"

   :score>=40
   ?"人を信じる心を持ちすぎています。"

   :"まだまだ新人。電話を100本くらい受けよう。";
 }
}
