<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>この言い訳、信じる？</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f1eb;color:#292929;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:560px;margin:auto;padding:20px 16px 40px}
.header{text-align:center;padding:12px 0 16px}
h1{font-size:28px;margin:4px 0 6px}
.sub{font-size:13px;color:#777}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;font-size:13px;color:#666}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 5px 20px #00000012}
.case{font-size:12px;color:#888;margin-bottom:8px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info div{background:#f5f3ef;border-radius:9px;padding:10px;font-size:13px}
.info b{display:block;font-size:16px;margin-top:2px}
.quote{margin:18px 0 22px;background:#292929;color:#fff;border-radius:14px;padding:18px;font-size:18px;line-height:1.8;position:relative}
.quote:before{content:"入居者";display:block;color:#aaa;font-size:11px;margin-bottom:5px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:12px;padding:17px 8px;font-size:18px;font-weight:700;cursor:pointer}
.truth{background:#dcefe2;color:#205d34}.lie{background:#f5dfe0;color:#8a2930}
button:active{transform:scale(.98)}
.result{display:none;text-align:center}
.result .big{font-size:28px;font-weight:800;margin:4px}
.correct{color:#25733f}.wrong{color:#a52d35}
.explain{text-align:left;background:#f5f3ef;border-radius:12px;padding:14px;margin-top:16px;font-size:14px;line-height:1.7}
.next{width:100%;background:#292929;color:#fff;margin-top:15px;font-size:16px}
.final{display:none;text-align:center}.final h2{font-size:25px}.score{font-size:42px;font-weight:800}
</style>
</head>
<body>

<div class="wrap">

<div class="header">
<h1>この言い訳、信じる？</h1>
<div class="sub">家賃滞納者の一言を、直感で見抜け。</div>
</div>

<div class="top">
<span id="count">CASE 1 / 20</span>
<strong>スコア：<span id="score">0</span></strong>
</div>

<div class="card" id="game">
<div class="case" id="case"></div>
<div class="info" id="info"></div>
<div class="quote" id="quote"></div>

<div class="buttons">
<button class="truth" onclick="answer(true)">🟢 真実</button>
<button class="lie" onclick="answer(false)">🔴 嘘</button>
</div>
</div>

<div class="card result" id="result">
<div class="big" id="resultBig"></div>
<div id="resultReason"></div>

<div class="explain" id="explain"></div>

<button class="next" onclick="next()">次の滞納者へ →</button>
</div>

<div class="card final" id="final">
<h2>あなたの滞納者見抜き力</h2>
<div class="score" id="finalScore"></div>
<p id="finalText"></p>
<button class="next" onclick="location.reload()">もう一度やる</button>
</div>

</div>

<script>

const cases=[

[
"佐藤さん","32歳","会社員","82,000円","1か月","過去の滞納なし",
"すみません、今月だけ会社の給与振込が遅れてまして……。来週の水曜日には必ず払います。",
true,
"過去3年間、遅延なし。今回だけ給与振込日がずれた記録があり、約束日も具体的。"
],

[
"田中さん","41歳","自営業","76,000円","2か月","過去にも3回遅延",
"先月分なら、もう払ったと思いますよ。妻が振り込んだはずなんですけど……。",
false,
"入金記録はなし。過去にも「家族が払った」「振り込んだはず」という説明を繰り返している。"
],

[
"山本さん","58歳","会社員","69,000円","1か月","過去の滞納なし",
"昨日、財布を落としちゃって……。カードも止めたので、銀行にも行けなかったんです。来週には払います。",
false,
"財布を落としたこと自体は事実。ただしネットバンキングなど別の支払い方法は利用できる状況。支払い方法を確認すると話が曖昧になる。"
],

[
"鈴木さん","29歳","会社員","74,000円","1か月","過去の滞納1回",
"給料日は25日なんですけど、今月は土日と重なって……。月曜日に入ると思います。",
true,
"給与日と金融機関の営業日の関係で入金日がずれるケース。説明にも一貫性がある。"
],

[
"高橋さん","46歳","会社員","91,000円","3か月","過去の滞納5回",
"今月ボーナスが出るので、そこからまとめて払います。絶対大丈夫です。",
false,
"ボーナスの支給予定はあるが、過去にも同じ約束をして支払いがなかった。今回も具体的な支払日がない。"
],

[
"伊藤さん","37歳","パート","65,000円","1か月","過去の滞納なし",
"子どもの学校関係で急な出費があって……。来週の給料日に必ず払います。",
true,
"過去の入金はすべて期日どおり。給料日も確認できており、支払日が具体的。"
],

[
"中村さん","52歳","自営業","88,000円","2か月","過去の滞納2回",
"取引先からの入金が遅れてるんです。来週には入るので、そこから払います。",
false,
"「来週」としか言わず具体的な入金日がない。過去にも同じ説明があり、約束が守られていない。"
],

[
"小林さん","34歳","会社員","79,000円","1か月","過去の滞納なし",
"あれ？もう振り込んだと思います。妻にも払っておいてって言ったんですけど……。",
true,
"本人の勘違い。確認すると妻が前日に振り込んでおり、入金名義が妻の名前だったため照合前だった。"
],

[
"加藤さん","44歳","会社員","72,000円","1か月","過去の滞納なし",
"すみません、振り込みましたよ。昨日の夕方です。",
false,
"入金記録なし。振込先を聞くと「いつもの口座です」としか答えられず、明細の確認を避ける。"
],

[
"吉田さん","61歳","年金生活","58,000円","1か月","過去の滞納なし",
"年金が入るのがいつもより遅くて……。来週の15日に入るので、その日にお支払いします。",
true,
"年金の支給日と本人の説明が一致。過去の支払い状況も良好。"
],

/* ここから追加ケース */

[
"井上さん","39歳","会社員","81,000円","2か月","過去にも2回遅延",
"すみません、スマホを落としてまして〜。連絡できませんでした。",
false,
"何度電話しても出なかったため保証人へ連絡したところ、本人からすぐ折り返しがあった。スマホを落としたこと自体は否定できないが、過去にも『携帯が壊れていた』『仕事で電話に出られなかった』など連絡がつかない理由が続いている。"
],

[
"森さん","35歳","会社員","78,000円","1か月","過去の滞納なし",
"昨日から体調を崩してしまって、電話もできなくて……。今日退院したので、今から振り込みます。",
true,
"本人から退院直後に連絡があり、入院の事実も確認できた。過去の滞納もない。"
],

[
"斎藤さん","48歳","自営業","95,000円","3か月","過去にも4回遅延",
"取引先から明日入金されるんで、明日には絶対払います。",
false,
"過去にも『明日入金される』という説明を何度もしているが、実際には支払われていない。今回も取引先名や入金予定額を具体的に説明できない。"
],

[
"清水さん","27歳","会社員","70,000円","1か月","過去の滞納なし",
"会社の給料日が今月から変わったんです。今月だけ家賃の支払いが間に合わなくて……。",
true,
"勤務先の給与支給日の変更が確認できる。本人からも事前に相談があり、次回の支払日を具体的に提示している。"
],

[
"山口さん","43歳","会社員","83,000円","2か月","過去にも3回遅延",
"家族が入院してしまって、急にお金が必要になったんです。",
false,
"家族の入院自体は事実だが、以前にも同じ事情を理由にしている。今回の滞納について具体的な支払計画はなく、話をすると『もう少し待ってください』の繰り返し。"
],

[
"松本さん","31歳","会社員","75,000円","1か月","過去の滞納なし",
"すみません、本当に家賃のことを忘れてました……。気づいたので今日中に払います。",
true,
"本人から先に連絡があり、入金も当日中に確認できた。過去の滞納もなく、単純な失念と判断できる。"
],

[
"石井さん","55歳","会社員","68,000円","2か月","過去にも2回遅延",
"携帯料金を払えてなくて電話が止まってたんです。だから連絡できませんでした。",
false,
"携帯が止まっていても、郵便・メールなど別の連絡手段はあった。督促への返信もなく、過去にも『電話が使えなかった』という説明をしている。"
],

[
"阿部さん","40歳","会社員","86,000円","1か月","過去の滞納なし",
"子どもの学校で急にまとまった集金があってしまって……。次の給料日に必ず払います。",
true,
"急な学校関連の出費があり、本人から事前に相談している。過去の支払い状況も良く、給料日も明確。"
],

[
"藤田さん","50歳","自営業","92,000円","3か月","過去にも5回遅延",
"銀行のシステム障害で振り込みできなかったんですよ。",
false,
"銀行のシステム障害は発生しておらず、本人も実際には振込操作をしていない。過去にも金融機関を理由に支払いが遅れている。"
],

[
"岡田さん","45歳","会社員","77,000円","2か月","過去にも1回遅延",
"昨日振り込みました。明日には反映されると思います。",
false,
"入金記録がなく、振込明細を確認すると別の口座への送金だった。本人は『たぶんこれです』と説明が変わる。"
]

];

let i=0;
let score=0;

function render(){

 const c=cases[i];

 document.getElementById("count").textContent=
 `CASE ${i+1} / ${cases.length}`;

 document.getElementById("case").textContent=
 `入居者：${c[0]}`;

 document.getElementById("info").innerHTML=
 `<div>年齢<b>${c[1]}</b></div>
  <div>職業<b>${c[2]}</b></div>
  <div>家賃<b>${c[3]}</b></div>
  <div>滞納<b>${c[4]}</b></div>
  <div style="grid-column:1/-1">
  過去の滞納<b>${c[5]}</b></div>`;

 document.getElementById("quote").textContent=c[6];

 document.getElementById("game").style.display="block";
 document.getElementById("result").style.display="none";
 document.getElementById("final").style.display="none";
}

function answer(choice){

 const c=cases[i];
 const ok=choice===c[7];

 if(ok) score+=5;

 document.getElementById("score").textContent=score;

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 document.getElementById("resultBig").className=
 "big "+(ok?"correct":"wrong");

 document.getElementById("resultBig").textContent=
 ok?"🎯 正解！":"😇 残念！";

 document.getElementById("resultReason").innerHTML=
 `答えは <b>${c[7]?"真実":"嘘"}</b> でした。`;

 document.getElementById("explain").innerHTML=
 `<b>管理会社メモ</b><br>${c[8]}`;

 document.querySelector(".next").textContent=
 i===cases.length-1?"結果を見る →":"次の滞納者へ →";
}

function next(){

 if(i<cases.length-1){

   i++;
   render();

 }else{

   document.getElementById("result").style.display="none";
   document.getElementById("final").style.display="block";

   document.getElementById("finalScore").textContent=
   score+" / 100";

   document.getElementById("finalText").textContent=

   score===100
   ?"完璧。もう滞納者の声が聞こえる。"

   :score>=90
   ?"完璧に近い。あなた、かなり疑り深いです。"

   :score>=80
   ?"かなり鋭い。滞納者からすると嫌な担当者。"

   :score>=70
   ?"なかなか。管理会社として良い嗅覚です。"

   :score>=60
   ?"悪くない。でも、もう少しだけ疑ってもいいかも。"

   :score>=40
   ?"人を信じる心を持ちすぎています。"

   :"まだまだ新人。電話を100本くらい受けよう。";
 }
}

render();

</script>
</body>
</html>
