/* ==================================================
   ゲーム用変数
   ================================================== */

let selectedCases=[];
let personIndex=0;
let turnIndex=0;

let score=0;
let paymentCount=0;
let wasteCount=0;
let chaosCount=0;


/* ==================================================
   50人から5人をランダム選択
   ================================================== */

function shuffle(array){

 return [...array].sort(
  ()=>Math.random()-0.5
 );

}

function startGame(){

 selectedCases=shuffle(cases).slice(0,5);

 personIndex=0;
 turnIndex=0;

 score=0;
 paymentCount=0;
 wasteCount=0;
 chaosCount=0;

 document.getElementById("points").textContent=0;

 render();

}


/* ==================================================
   表示
   ================================================== */

function render(){

 const person=selectedCases[personIndex];
 const turn=person.turns[turnIndex];

 document.getElementById("count").textContent=
 `入居者 ${personIndex+1} / 5　｜　ターン ${turnIndex+1} / 3`;

 document.getElementById("case").textContent=
 `入居者：${person.name}`;

 document.getElementById("info").innerHTML=`
 <div>年齢<b>${person.age}</b></div>
 <div>職業<b>${person.job}</b></div>
 <div>家賃<b>${person.rent}</b></div>
 <div>滞納<b>${person.arrears}</b></div>
 <div style="grid-column:1/-1">
 過去の滞納<b>${person.history}</b>
 </div>
 `;

 document.getElementById("dialogue").textContent=
 turn.dialogue;

 const choices=document.getElementById("choices");

 choices.innerHTML="";

 turn.choices.forEach((choice,index)=>{

  const button=document.createElement("button");

  button.className="choice";

  button.textContent=
   `${index+1}. ${choice[0]}`;

  button.onclick=()=>{
   answer(choice);
  };

  choices.appendChild(button);

 });

 document.getElementById("game").style.display="block";
 document.getElementById("result").style.display="none";
 document.getElementById("final").style.display="none";

 const totalTurns=15;
 const currentTurn=
  personIndex*3+turnIndex;

 document.getElementById("progressBar").style.width=
 ((currentTurn)/totalTurns*100)+"%";

}


/* ==================================================
   回答
   ================================================== */

function answer(choice){

 const type=choice[1];

 if(type==="good"){

  score+=10;

  if(
   choice[0].includes("いつ") ||
   choice[0].includes("何日") ||
   choice[0].includes("払") ||
   choice[0].includes("振り込") ||
   choice[0].includes("支払")
  ){
   paymentCount++;
  }

 }

 if(type==="waste"){
  wasteCount++;
  score=Math.max(0,score-2);
 }

 if(type==="chaos"){
  chaosCount++;
  score=Math.max(0,score-3);
 }

 document.getElementById("points").textContent=score;

 document.getElementById("game").style.display="none";
 document.getElementById("result").style.display="block";

 const big=document.getElementById("resultBig");

 if(type==="good"){

  big.textContent="🎯 いい質問！";
  big.className="result-big good";

 }else if(type==="waste"){

  big.textContent="😇 それ聞いてどうする？";
  big.className="result-big neutral";

 }else{

  big.textContent="🌀 振り回された！";
  big.className="result-big bad";

 }

 document.getElementById("resultText").innerHTML=
 `<b>入居者：</b>${choice[2]}`;

 document.getElementById("explain").innerHTML=
 `<b>管理会社メモ</b><br>${choice[3]}`;

 if(
  personIndex===4 &&
  turnIndex===2
 ){

  document.getElementById("nextButton").textContent=
   "結果を見る →";

 }else{

  document.getElementById("nextButton").textContent=
   "次へ →";

 }

}


/* ==================================================
   次のターン
   ================================================== */

function nextTurn(){

 if(turnIndex<2){

  turnIndex++;

 }else{

  turnIndex=0;
  personIndex++;

 }

 if(personIndex>=5){

  showFinal();

 }else{

  render();

 }

}


/* ==================================================
   最終結果
   ================================================== */

function showFinal(){

 document.getElementById("result").style.display="none";
 document.getElementById("game").style.display="none";
 document.getElementById("final").style.display="block";

 document.getElementById("progressBar").style.width="100%";

 document.getElementById("finalScore").textContent=
 score+" 点";

 document.getElementById("paymentCount").textContent=
 paymentCount+" / 15";

 document.getElementById("wasteCount").textContent=
 wasteCount+" 回";

 document.getElementById("chaosCount").textContent=
 chaosCount+" 回";


 let comment="";

 if(
  paymentCount>=13 &&
  wasteCount<=1 &&
  chaosCount<=1
 ){

  comment=
  "完璧。あなた、滞納者との電話にかなり強い。<br>"+
  "相手が何を言っても、ちゃんと「で、いつ払える？」に戻せています。";

 }else if(
  paymentCount>=10 &&
  wasteCount<=3
 ){

  comment=
  "かなり優秀。<br>"+
  "話が逸れても、ちゃんと家賃の話に戻せています。";

 }else if(chaosCount>=5){

  comment=
  "滞納者にめちゃくちゃ振り回されています。<br>"+
  "お願いだから、電磁波とか鳩の話に付き合わないでください。";

 }else if(wasteCount>=5){

  comment=
  "あなた、質問が多いです。<br>"+
  "滞納者の人生相談ではなく、家賃の回収をしましょう。";

 }else{

  comment=
  "悪くないです。<br>"+
  "ただし、もう少しだけ「で、いつ払えますか？」を強く聞いてもいいかもしれません。";

 }

 document.getElementById("finalComment").innerHTML=
 comment;

}


/* ==================================================
   スタート
   ================================================== */

startGame();
