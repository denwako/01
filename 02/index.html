<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>滞納者に払わせろ！</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f1eb;
  color:#292929;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:20px 16px 40px;
}

.header{
  text-align:center;
  padding:18px 0 20px;
}

h1{
  font-size:30px;
  margin:4px 0 8px;
}

.sub{
  font-size:14px;
  color:#777;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
  font-size:13px;
  color:#666;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #00000012;
}

.case{
  font-size:12px;
  color:#888;
  margin-bottom:8px;
}

.name{
  font-size:21px;
  font-weight:800;
  margin-bottom:12px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:14px 0;
}

.info div{
  background:#f5f3ef;
  border-radius:9px;
  padding:10px;
  font-size:13px;
}

.info b{
  display:block;
  font-size:16px;
  margin-top:2px;
}

.quote{
  margin:18px 0 20px;
  background:#292929;
  color:#fff;
  border-radius:14px;
  padding:18px;
  font-size:17px;
  line-height:1.8;
}

.quote:before{
  content:"入居者";
  display:block;
  color:#aaa;
  font-size:11px;
  margin-bottom:5px;
}

.turn{
  font-size:13px;
  color:#888;
  margin-bottom:8px;
}

.question{
  font-size:17px;
  font-weight:700;
  line-height:1.6;
  margin:12px 0 14px;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  background:#f5f3ef;
  border:2px solid transparent;
  border-radius:12px;
  padding:14px;
  text-align:left;
  font-size:15px;
  line-height:1.5;
  cursor:pointer;
}

.answer:hover{
  border-color:#999;
}

.answer:active{
  transform:scale(.98);
}

.result{
  display:none;
}

.resultTitle{
  font-size:25px;
  font-weight:800;
  text-align:center;
  margin-bottom:12px;
}

.resultText{
  line-height:1.7;
  font-size:15px;
}

.good{
  color:#25733f;
}

.bad{
  color:#a52d35;
}

.next{
  width:100%;
  background:#292929;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.final{
  display:none;
  text-align:center;
}

.final h2{
  font-size:25px;
}

.score{
  font-size:42px;
  font-weight:800;
  margin:10px 0 20px;
}

.stats{
  background:#f5f3ef;
  border-radius:14px;
  padding:16px;
  text-align:left;
  line-height:2;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:18px;
}

.restart{
  width:100%;
  background:#292929;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
  <h1>滞納者に払わせろ！</h1>
  <div class="sub">
    言い訳に負けずに、3ターンで支払日を引き出せ。
  </div>
</div>

<div class="top">
  <span id="progress">滞納者 1 / 5</span>
  <strong>支払日確定：<span id="successCount">0</span></strong>
</div>


<!-- =========================
     GAME
========================= -->

<div class="card" id="game">

  <div class="case" id="caseNumber">
    滞納者 CASE
  </div>

  <div class="name" id="name"></div>

  <div class="info" id="info"></div>

  <div class="quote" id="quote"></div>

  <div class="turn" id="turn">
    TURN 1 / 3
  </div>

  <div class="question" id="question">
  </div>

  <div class="answers" id="answers">
  </div>

</div>


<!-- =========================
     RESULT
========================= -->

<div class="card result" id="result">

  <div class="resultTitle" id="resultTitle"></div>

  <div class="resultText" id="resultText"></div>

  <button class="next" onclick="nextTurn()">
    次へ →
  </button>

</div>


<!-- =========================
     FINAL
========================= -->

<div class="card final" id="final">

  <h2>🏆 あなたの滞納対応力</h2>

  <div class="score" id="finalScore">
    0 / 5
  </div>

  <div class="stats">

    <div>
      💰 支払日を引き出した回数：
      <strong id="statPayment">0</strong> / 5
    </div>

    <div>
      ❓ 無駄な質問：
      <strong id="statWaste">0</strong> 回
    </div>

    <div>
      🌀 滞納者に振り回された回数：
      <strong id="statTrouble">0</strong> 回
    </div>

  </div>

  <p class="small" id="finalMessage"></p>

  <button class="restart" onclick="location.reload()">
    もう一度やる
  </button>

</div>

</div>

/*
==================================================
ゲーム設定
==================================================
*/

let selected=[];
let tenantIndex=0;
let turnIndex=0;

let paymentSuccess=0;
let wasteQuestions=0;
let troubleCount=0;

let currentResult=false;


/*
==================================================
ランダム選択
==================================================
*/

function shuffle(arr){

  const copy=[...arr];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}


/*
==================================================
ゲーム開始
==================================================
*/

function startGame(){

  selected=shuffle(tenants).slice(0,5);

  tenantIndex=0;
  turnIndex=0;

  paymentSuccess=0;
  wasteQuestions=0;
  troubleCount=0;

  render();

}


/*
==================================================
表示
==================================================
*/

function render(){

  const t=selected[tenantIndex];
  const turn=t.turns[turnIndex];

  document.getElementById("game").style.display="block";
  document.getElementById("result").style.display="none";
  document.getElementById("final").style.display="none";

  document.getElementById("progress").textContent=
    `滞納者 ${tenantIndex+1} / 5`;

  document.getElementById("successCount").textContent=
    paymentSuccess;

  document.getElementById("caseNumber").textContent=
    `CASE ${tenantIndex+1}`;

  document.getElementById("name").textContent=
    t.name;

  document.getElementById("info").innerHTML=`

    <div>
      年齢
      <b>${t.age}</b>
    </div>

    <div>
      職業
      <b>${t.job}</b>
    </div>

    <div>
      家賃
      <b>${t.rent}</b>
    </div>

    <div>
      滞納
      <b>${t.arrears}</b>
    </div>

    <div style="grid-column:1/-1">
      過去の滞納
      <b>${t.history}</b>
    </div>

  `;

  document.getElementById("quote").textContent=
    t.quote;

  document.getElementById("turn").textContent=
    `TURN ${turnIndex+1} / 3`;

  document.getElementById("question").textContent=
    turn.q;

  const answers=document.getElementById("answers");

  answers.innerHTML="";

  turn.a.forEach((item,index)=>{

    const button=document.createElement("button");

    button.className="answer";

    button.textContent=
      `${index+1}. ${item[0]}`;

    button.onclick=()=>answer(item[1]);

    answers.appendChild(button);

  });

}


/*
==================================================
回答
==================================================
*/

function answer(correct){

  const t=selected[tenantIndex];

  currentResult=correct;

  if(correct){

    /*
    3ターン目で正解
    → 支払日確定
    */

    if(turnIndex===2){

      paymentSuccess++;

    }

  }else{

    wasteQuestions++;

    /*
    変な回答や話が逸れた回答
    */

    if(turnIndex>0){

      troubleCount++;

    }

  }

  document.getElementById("game").style.display="none";

  document.getElementById("result").style.display="block";

  const title=document.getElementById("resultTitle");

  const text=document.getElementById("resultText");

  if(correct){

    title.className="resultTitle good";

    title.textContent="🎯 いい質問！";

    if(turnIndex===2){

      text.innerHTML=
        "支払日を引き出しました。<br><br>"+
        "<strong>この調子で次の滞納者へ。</strong>";

    }else{

      text.innerHTML=
        "話を前に進める質問です。<br><br>"+
        "まだあと1ターンあります。";

    }

  }else{

    title.className="resultTitle bad";

    title.textContent="😇 そこじゃない！";

    text.innerHTML=
      "滞納者の話に引っ張られています。<br><br>"+
      "<strong>「で、いつ払えるんですか？」</strong>"+
      "を忘れずに。";

  }

  const nextButton=
    document.querySelector(".next");

  if(turnIndex===2){

    nextButton.textContent=
      tenantIndex===4
      ?"結果を見る →"
      :"次の滞納者へ →";

  }else{

    nextButton.textContent=
      "次のターンへ →";

  }

}


/*
==================================================
次へ
==================================================
*/

function nextTurn(){

  if(turnIndex<2){

    turnIndex++;

    render();

    return;

  }

  if(tenantIndex<4){

    tenantIndex++;

    turnIndex=0;

    render();

    return;

  }

  showFinal();

}


/*
==================================================
最終結果
==================================================
*/

function showFinal(){

  document.getElementById("game").style.display="none";

  document.getElementById("result").style.display="none";

  document.getElementById("final").style.display="block";

  document.getElementById("finalScore").textContent=
    `${paymentSuccess} / 5`;

  document.getElementById("statPayment").textContent=
    paymentSuccess;

  document.getElementById("statWaste").textContent=
    wasteQuestions;

  document.getElementById("statTrouble").textContent=
    troubleCount;

  let message="";

  if(paymentSuccess===5){

    message=
      "完璧。言い訳を聞きながら、ちゃんと支払日を引き出しています。";

  }else if(paymentSuccess>=4){

    message=
      "かなり優秀。滞納者に話をそらされても戻せています。";

  }else if(paymentSuccess>=3){

    message=
      "なかなか。もう少しだけ「で、いつ払える？」を強く聞いてみましょう。";

  }else if(paymentSuccess>=1){

    message=
      "優しすぎるかも。滞納者の話を聞くことと、支払日を決めることは別です。";

  }else{

    message=
      "……滞納者の話を聞いて終わっています。管理会社としては危険です。";

  }

  document.getElementById("finalMessage").textContent=
    message;

}


/*
==================================================
開始
==================================================
*/

startGame();
