<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>滞納者に払わせろ！</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f1eb;
  color:#292929;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.header{
  background:#292929;
  color:white;
  padding:24px 18px 22px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:28px;
  letter-spacing:.04em;
}

.sub{
  margin-top:8px;
  font-size:14px;
  opacity:.85;
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:18px;
}

.status{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px;
}

.badge{
  background:white;
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  flex:1;
  text-align:center;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.case{
  font-size:13px;
  color:#777;
  margin-bottom:6px;
}

.turn{
  font-size:13px;
  color:#777;
  margin-bottom:16px;
}

.name{
  font-size:21px;
  font-weight:bold;
  margin-bottom:18px;
}

.excuse{
  background:#f5f3ef;
  border-radius:14px;
  padding:18px;
  font-size:17px;
  line-height:1.8;
  margin-bottom:22px;
}

.label{
  font-size:13px;
  color:#777;
  margin-bottom:10px;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px 16px;
  background:#292929;
  color:white;
  font-size:15px;
  text-align:left;
  cursor:pointer;
  transition:.15s;
}

.answer:hover{
  opacity:.85;
  transform:translateY(-1px);
}

.answer:disabled{
  opacity:.45;
  cursor:default;
  transform:none;
}

.result{
  margin-top:18px;
  padding:16px;
  border-radius:12px;
  background:#f1eee8;
  line-height:1.7;
  display:none;
}

.result.show{
  display:block;
}

.next{
  margin-top:14px;
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#b33a2f;
  color:white;
  font-size:15px;
  cursor:pointer;
  display:none;
}

.next.show{
  display:block;
}

.score{
  margin-top:18px;
  background:white;
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.score h2{
  margin-top:0;
}

.scoreRow{
  padding:12px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
}

.scoreRow:last-child{
  border-bottom:0;
}

.big{
  font-size:24px;
  font-weight:bold;
}

.restart{
  width:100%;
  margin-top:18px;
  border:0;
  border-radius:12px;
  padding:15px;
  background:#292929;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.hidden{
  display:none;
}

@media(max-width:520px){
  .header h1{
    font-size:24px;
  }

  .card{
    padding:17px;
  }

  .excuse{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>滞納者に払わせろ！</h1>
  <div class="sub">言い訳に負けずに、3ターンで支払日を引き出せ。</div>
</div>

<div class="wrap">

  <div id="game">

    <div class="status">
      <div class="badge">
        滞納者 <span id="personNo">1</span> / 5
      </div>

      <div class="badge">
        支払日確定：<span id="confirmed">0</span>
      </div>
    </div>

    <div class="card">

      <div class="case" id="caseTitle">
        滞納者 CASE
      </div>

      <div class="turn">
        TURN <span id="turnNo">1</span> / 3
      </div>

      <div class="name" id="personName">
        ---
      </div>

      <div class="excuse" id="excuse">
        ---
      </div>

      <div class="label">
        どう聞く？
      </div>

      <div class="answers" id="answers">
      </div>

      <div class="result" id="result">
      </div>

      <button class="next" id="nextBtn">
        次のターンへ →
      </button>

    </div>

  </div>

  <div class="score hidden" id="scoreScreen">

    <h2>🏆 あなたの滞納対応力</h2>

    <div class="scoreRow">
      <span>支払日を引き出した回数</span>
      <span class="big">
        <span id="finalConfirmed">0</span> / 5
      </span>
    </div>

    <div class="scoreRow">
      <span>無駄な質問</span>
      <span>
        <span id="waste">0</span> 回
      </span>
    </div>

    <div class="scoreRow">
      <span>滞納者に振り回された回数</span>
      <span>
        <span id="confused">0</span> 回
      </span>
    </div>

    <button class="restart" onclick="location.reload()">
      もう一度やる
    </button>

  </div>

</div>

/* =========================================================
   ゲーム状態
========================================================= */

let selectedCases = [];
let personIndex = 0;
let turn = 1;

let confirmed = 0;
let waste = 0;
let confused = 0;

let answered = false;


/* =========================================================
   5人をランダム選出
========================================================= */

function shuffle(array){
  return [...array].sort(() => Math.random() - 0.5);
}

function startGame(){

  selectedCases = shuffle(cases).slice(0,5);

  personIndex = 0;
  turn = 1;

  confirmed = 0;
  waste = 0;
  confused = 0;

  document.getElementById("game").classList.remove("hidden");
  document.getElementById("scoreScreen").classList.add("hidden");

  showTurn();
}


/* =========================================================
   現在のターンを表示
========================================================= */

function showTurn(){

  answered = false;

  const person = selectedCases[personIndex];

  document.getElementById("personNo").textContent =
    personIndex + 1;

  document.getElementById("confirmed").textContent =
    confirmed;

  document.getElementById("turnNo").textContent =
    turn;

  document.getElementById("personName").textContent =
    person.name;

  document.getElementById("excuse").textContent =
    "「" + person.excuse + "」";

  document.getElementById("result").className =
    "result";

  document.getElementById("result").innerHTML = "";

  document.getElementById("nextBtn").className =
    "next";

  const answers =
    document.getElementById("answers");

  answers.innerHTML = "";

  const shuffledQuestions =
    shuffle(person.replies);

  shuffledQuestions.forEach((question,index)=>{

    const button =
      document.createElement("button");

    button.className = "answer";

    button.textContent =
      "「" + question + "」";

    button.onclick = () =>
      chooseQuestion(question);

    answers.appendChild(button);

  });

}


/* =========================================================
   質問を選択
========================================================= */

function chooseQuestion(question){

  if(answered) return;

  answered = true;

  const person = selectedCases[personIndex];

  const buttons =
    document.querySelectorAll(".answer");

  buttons.forEach(button=>{
    button.disabled = true;
  });


  /*
    質問内容によって、
    その人の返答を少し変える。
  */

  let reply = "";

  if(
    question.includes("いつ") ||
    question.includes("何日") ||
    question.includes("支払え") ||
    question.includes("払え")
  ){

    reply =
      person.dates[Math.floor(
        Math.random() * person.dates.length
      )];

  }else{

    reply =
      person.dates[Math.floor(
        Math.random() * person.dates.length
      )];

  }


  /*
    支払日を具体的に引き出せたか判定
  */

  const hasDate =
    /今日|明日|明後日|金曜日|月曜日|来週|来月|25日|28日|5日|夕方|午前中/.test(reply);

  const result =
    document.getElementById("result");


  if(hasDate){

    result.innerHTML =
      "<strong>滞納者：</strong>「" +
      reply +
      "」";

  }else{

    result.innerHTML =
      "<strong>滞納者：</strong>「" +
      reply +
      "」";

  }

  result.classList.add("show");


  /*
    3ターン目なら、
    支払日を引き出せたか判定
  */

  if(turn === 3){

    if(hasDate){

      confirmed++;

      result.innerHTML +=
        "<br><br>✅ <strong>支払日を引き出した！</strong>";

    }else{

      confused++;

      result.innerHTML +=
        "<br><br>😵 <strong>結局、支払日が分からなかった……。</strong>";

    }

    document.getElementById("nextBtn").textContent =
      personIndex === 4
      ? "結果を見る →"
      : "次の滞納者へ →";

    document.getElementById("nextBtn").classList.add("show");

    return;
  }


  /*
    まだ3ターン目ではない
  */

  if(
    !question.includes("いつ") &&
    !question.includes("何日") &&
    !question.includes("支払") &&
    !question.includes("払")
  ){

    waste++;

  }

  document.getElementById("nextBtn").textContent =
    "次のターンへ →";

  document.getElementById("nextBtn").classList.add("show");
}


/* =========================================================
   次へ
========================================================= */

document.getElementById("nextBtn").onclick = function(){

  if(turn < 3){

    turn++;

    showTurn();

    return;
  }


  if(personIndex < 4){

    personIndex++;

    turn = 1;

    showTurn();

    return;
  }


  showScore();

};


/* =========================================================
   結果
========================================================= */

function showScore(){

  document.getElementById("game")
    .classList.add("hidden");

  document.getElementById("scoreScreen")
    .classList.remove("hidden");

  document.getElementById("finalConfirmed")
    .textContent = confirmed;

  document.getElementById("waste")
    .textContent = waste;

  document.getElementById("confused")
    .textContent = confused;
}


/* =========================================================
   開始
========================================================= */

startGame();
