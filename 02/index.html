<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>滞納者に払わせろ！</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f1eb;
  color:#292929;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:20px 16px 50px;
}

.header{
  text-align:center;
  padding:10px 0 18px;
}

h1{
  font-size:30px;
  margin:4px 0 7px;
}

.sub{
  font-size:13px;
  color:#777;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
  font-size:13px;
  color:#666;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #00000012;
}

.case{
  font-size:13px;
  color:#888;
  margin-bottom:5px;
}

.name{
  font-size:23px;
  font-weight:800;
  margin-bottom:12px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:14px 0;
}

.info div{
  background:#f5f3ef;
  border-radius:9px;
  padding:10px;
  font-size:12px;
}

.info b{
  display:block;
  font-size:15px;
  margin-top:3px;
}

.quote{
  margin:18px 0;
  background:#292929;
  color:#fff;
  border-radius:14px;
  padding:18px;
  font-size:17px;
  line-height:1.8;
  position:relative;
}

.quote:before{
  content:"入居者";
  display:block;
  color:#aaa;
  font-size:11px;
  margin-bottom:5px;
}

.question{
  font-weight:800;
  font-size:16px;
  margin:18px 0 10px;
}

.choices{
  display:grid;
  gap:10px;
}

.choice{
  border:0;
  border-radius:12px;
  padding:15px 13px;
  font-size:15px;
  font-weight:700;
  text-align:left;
  cursor:pointer;
  background:#f1eee8;
  color:#292929;
  line-height:1.5;
}

.choice:hover{
  background:#e8e3da;
}

.choice:active{
  transform:scale(.98);
}

.result{
  display:none;
  text-align:center;
}

.resultBig{
  font-size:27px;
  font-weight:800;
  margin:5px;
}

.resultReason{
  font-size:15px;
  margin:10px 0;
  line-height:1.6;
}

.explain{
  text-align:left;
  background:#f5f3ef;
  border-radius:12px;
  padding:14px;
  margin-top:15px;
  font-size:14px;
  line-height:1.7;
}

.next{
  width:100%;
  background:#292929;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:15px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.final{
  display:none;
  text-align:center;
}

.final h2{
  font-size:25px;
}

.finalScore{
  font-size:42px;
  font-weight:800;
  margin:10px;
}

.finalStats{
  background:#f5f3ef;
  border-radius:14px;
  padding:15px;
  margin-top:15px;
  text-align:left;
  line-height:2;
}

.restart{
  width:100%;
  background:#292929;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:18px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.badge{
  display:inline-block;
  background:#292929;
  color:#fff;
  border-radius:20px;
  padding:5px 10px;
  font-size:11px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="wrap">

<div class="header">
  <h1>滞納者に払わせろ！</h1>
  <div class="sub">言い訳に負けるな。3ターンで支払日を引き出せ。</div>
</div>

<div class="top">
  <span id="progress">入居者 1 / 5　｜　TURN 1 / 3</span>
  <strong>評価：<span id="score">0</span></strong>
</div>

<div class="card" id="game">

  <div class="case" id="case"></div>
  <div class="name" id="name"></div>

  <div class="info" id="info"></div>

  <div class="quote" id="quote"></div>

  <div class="question" id="question">
    どう対応する？
  </div>

  <div class="choices" id="choices"></div>

</div>


<div class="card result" id="result">

  <div class="resultBig" id="resultBig"></div>

  <div class="resultReason" id="resultReason"></div>

  <div class="explain" id="explain"></div>

  <button class="next" id="nextButton" onclick="nextTurn()">
    次へ →
  </button>

</div>


<div class="card final" id="final">

  <div class="badge">GAME CLEAR</div>

  <h2>🏆 あなたの滞納対応力</h2>

  <div class="finalScore" id="finalScore"></div>

  <div class="finalStats">

    <div>
      💰 支払日を引き出した回数：
      <strong><span id="paymentCount"></span> / 5</strong>
    </div>

    <div>
      ❓ 無駄な質問：
      <strong><span id="wasteCount"></span>回</strong>
    </div>

    <div>
      🌀 滞納者に振り回された回数：
      <strong><span id="confusedCount"></span>回</strong>
    </div>

  </div>

  <p id="finalText"></p>

  <button class="restart" onclick="location.reload()">
    もう一度やる
  </button>

</div>

</div>


<script>

/*
====================================================
滞納者データ
50人
====================================================

name
age
job
rent
delay
history
opening
turns

turns:
  question
  choices

choice:
  text
  effect
    payment = 支払日を引き出す
    waste = 無駄な質問
    confused = 振り回される
    normal = 特に変化なし

  reply
  nextQuestion
*/


const cases = [

/* =========================

choices:[

/* =========================

========================= */

{

delay:"2か月",history:"過去にも2回遅延",
opening:"取引先からの入金が遅れてるんです。来週には入るので。",

{
question:"何を聞く？",

{

/*
====================================================
ゲームシステム
====================================================
*/

let selectedCases=[];
let currentPerson=0;
let currentTurn=0;

let score=0;
let paymentCount=0;
let wasteCount=0;
let confusedCount=0;


/* 配列シャッフル */

function shuffle(array){

  const copy=[...array];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];

  }

  return copy;
}


/* 50人から5人選択 */

function startGame(){

  selectedCases=shuffle(cases).slice(0,5);

  currentPerson=0;
  currentTurn=0;

  score=0;
  paymentCount=0;
  wasteCount=0;
  confusedCount=0;

  render();

}


/* 表示 */

function render(){

  const c=selectedCases[currentPerson];
  const turn=c.turns[currentTurn];

  document.getElementById("progress").textContent=
    `入居者 ${currentPerson+1} / 5　｜　TURN ${currentTurn+1} / 3`;

  document.getElementById("score").textContent=score;

  document.getElementById("case").textContent=
    `CASE ${currentPerson+1}`;

  document.getElementById("name").textContent=
    c.name;

  document.getElementById("info").innerHTML=`
    <div>
      年齢
      <b>${c.age}</b>
    </div>

    <div>
      職業
      <b>${c.job}</b>
    </div>

    <div>
      家賃
      <b>${c.rent}</b>
    </div>

    <div>
      滞納
      <b>${c.delay}</b>
    </div>

    <div style="grid-column:1/-1">
      過去の滞納
      <b>${c.history}</b>
    </div>
  `;

  document.getElementById("quote").textContent=
    currentTurn===0
    ? c.opening
    : turn.previousReply || "……";

  document.getElementById("question").textContent=
    turn.question;

  const choices=document.getElementById("choices");

  choices.innerHTML="";

  turn.choices.forEach((choice,index)=>{

    const button=document.createElement("button");

    button.className="choice";

    button.textContent=
      `${index+1}. ${choice.text}`;

    button.onclick=()=>answer(choice);

    choices.appendChild(button);

  });

  document.getElementById("game").style.display="block";
  document.getElementById("result").style.display="none";
  document.getElementById("final").style.display="none";

}


/* 回答 */

function answer(choice){

  if(choice.effect==="payment"){

    score+=10;
    paymentCount++;

  }

  else if(choice.effect==="waste"){

    score-=3;
    wasteCount++;

  }

  else if(choice.effect==="confused"){

    score-=5;
    confusedCount++;

  }


  if(score<0) score=0;

  document.getElementById("score").textContent=score;

  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="block";

  let title="";

  if(choice.effect==="payment"){

    title="💰 支払日を引き出した！";

  }

  else if(choice.effect==="waste"){

    title="❓ それ、聞かなくてもよかったかも";

  }

  else if(choice.effect==="confused"){

    title="🌀 滞納者に振り回された！";

  }

  else{

    title="👍 まずまずの対応";

  }

  document.getElementById("resultBig").textContent=title;

  document.getElementById("resultReason").innerHTML=
    choice.reply;

  document.getElementById("explain").innerHTML=
    `<b>今回のポイント</b><br>
    ${
      choice.effect==="payment"
      ?"具体的な支払日・支払条件を引き出せました。"
      :
      choice.effect==="waste"
      ?"相手の事情に入り込みすぎるより、「いつ払えるのか」を聞くほうが有効です。"
      :
      choice.effect==="confused"
      ?"相手の話に付き合いすぎると、本来確認すべき支払日の話からそれてしまいます。"
      :
      "悪くない対応です。ただし、できれば具体的な支払日まで確認したいところです。"
    }`;

  const nextButton=document.getElementById("nextButton");

  if(currentTurn===2 && currentPerson===4){

    nextButton.textContent="結果を見る →";

  }

  else if(currentTurn===2){

    nextButton.textContent="次の滞納者へ →";

  }

  else{

    nextButton.textContent="次のターンへ →";

  }

}


/* 次へ */

function nextTurn(){

  /*
  次のターン
  */

  if(currentTurn<2){

    currentTurn++;

    /*
    前のターンの回答を次のターンに表示
    */

    const resultText=
      document.getElementById("resultReason").textContent;

    selectedCases[currentPerson]
      .turns[currentTurn]
      .previousReply=resultText;

    render();

    return;

  }


  /*
  次の入居者
  */

  if(currentPerson<4){

    currentPerson++;
    currentTurn=0;

    render();

    return;

  }


  /*
  ゲーム終了
  */

  showFinal();

}


/* 最終結果 */

function showFinal(){

  document.getElementById("game").style.display="none";
  document.getElementById("result").style.display="none";
  document.getElementById("final").style.display="block";

  document.getElementById("finalScore").textContent=
    score+"点";

  document.getElementById("paymentCount").textContent=
    paymentCount;

  document.getElementById("wasteCount").textContent=
    wasteCount;

  document.getElementById("confusedCount").textContent=
    confusedCount;


  let text="";


  if(score>=120){

    text=
      "🏆 完璧！滞納者の話を聞きながら、しっかり支払日を引き出しています。";

  }

  else if(score>=90){

    text=
      "👏 かなり優秀！滞納者に振り回されず、具体的な支払日を取れています。";

  }

  else if(score>=60){

    text=
      "👍 なかなかです。でも、もう少し「で、いつ払えるんですか？」を強く聞いてもいいかも。";

  }

  else if(score>=30){

    text=
      "😅 優しすぎます。滞納者の事情を聞くうちに、支払日の話がどこかへ行っています。";

  }

  else{

    text=
      "😂 完全に滞納者に持っていかれています。管理会社に戻ってきてください。";

  }


  document.getElementById("finalText").textContent=text;

}


/* スタート */

startGame();

</script>
