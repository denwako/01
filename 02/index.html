<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>滞納者に払わせろ！</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f1eb;
  color:#292929;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.wrap{
  max-width:600px;
  margin:auto;
  padding:20px 16px 50px;
}

.header{
  text-align:center;
  padding:18px 0 18px;
}

h1{
  font-size:30px;
  margin:4px 0 8px;
}

.sub{
  font-size:14px;
  color:#777;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0 12px;
  font-size:13px;
  color:#666;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #00000012;
}

.progress{
  height:7px;
  background:#e5e1da;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:18px;
}

.progressBar{
  height:100%;
  background:#292929;
  width:0%;
  transition:.3s;
}

.person{
  font-size:24px;
  font-weight:800;
  margin-bottom:4px;
}

.personMeta{
  color:#777;
  font-size:13px;
  margin-bottom:16px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:14px 0;
}

.info div{
  background:#f5f3ef;
  border-radius:9px;
  padding:10px;
  font-size:12px;
}

.info b{
  display:block;
  font-size:15px;
  margin-top:3px;
}

.turn{
  font-size:13px;
  font-weight:bold;
  color:#888;
  margin:18px 0 8px;
}

.quote{
  margin:0 0 18px;
  background:#292929;
  color:#fff;
  border-radius:14px;
  padding:18px;
  font-size:17px;
  line-height:1.75;
}

.quote:before{
  content:"入居者";
  display:block;
  color:#aaa;
  font-size:11px;
  margin-bottom:5px;
}

.questionTitle{
  font-size:15px;
  font-weight:800;
  margin:18px 0 10px;
}

.options{
  display:grid;
  gap:9px;
}

.option{
  width:100%;
  text-align:left;
  background:#f5f3ef;
  border:2px solid transparent;
  border-radius:12px;
  padding:14px;
  font-size:14px;
  line-height:1.5;
  cursor:pointer;
}

.option:hover{
  border-color:#aaa;
}

.option:active{
  transform:scale(.98);
}

.result{
  display:none;
}

.resultTitle{
  font-size:23px;
  font-weight:800;
  margin-bottom:10px;
}

.resultText{
  line-height:1.7;
  font-size:14px;
}

.bad{
  color:#a52d35;
  font-weight:bold;
}

.good{
  color:#25733f;
  font-weight:bold;
}

.next{
  width:100%;
  background:#292929;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:16px;
  margin-top:16px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.final{
  display:none;
  text-align:center;
}

.final h2{
  font-size:25px;
}

.finalScore{
  font-size:44px;
  font-weight:800;
  margin:12px 0;
}

.finalBox{
  background:#f5f3ef;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  line-height:2;
  text-align:left;
}

.start{
  text-align:center;
}

.startText{
  font-size:14px;
  line-height:1.8;
  color:#666;
}

.startButton{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  background:#292929;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

.badge{
  display:inline-block;
  font-size:11px;
  padding:4px 8px;
  border-radius:20px;
  background:#eee;
  color:#666;
  margin-top:5px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- =========================
       タイトル
  ========================== -->

  <div class="header">
    <h1>滞納者に払わせろ！</h1>
    <div class="sub">
      言い訳に負けずに、3ターンで支払日を引き出せ。
    </div>
  </div>


  <!-- =========================
       スタート画面
  ========================== -->

  <div class="card start" id="start">

    <h2>家賃滞納対応ゲーム</h2>

    <div class="startText">
      あなたは賃貸管理会社の担当者。<br>
      滞納者の言い訳を聞きながら、<br>
      <b>3ターン以内に具体的な支払日を引き出してください。</b>
      <br><br>
      普通の滞納者もいれば、<br>
      とんでもないことを言い出す滞納者もいます。
      <br><br>
      ただし――<br>
      <b>変な人だからといって、嘘とは限りません。</b>
    </div>

    <button class="startButton" onclick="startGame()">
      滞納者対応を開始する
    </button>

  </div>


  <!-- =========================
       ゲーム画面
  ========================== -->

  <div id="game" class="hidden">

    <div class="top">
      <span id="personCount">滞納者 1 / 5</span>
      <strong>
        支払日 <span id="paymentCount">0</span> / 5
      </strong>
    </div>

    <div class="progress">
      <div class="progressBar" id="progressBar"></div>
    </div>

    <div class="card">

      <div class="person" id="personName"></div>

      <div class="personMeta" id="personMeta"></div>

      <div class="info" id="personInfo"></div>

      <div class="turn" id="turn"></div>

      <div class="quote" id="quote"></div>

      <div class="questionTitle">
        どう聞く？
      </div>

      <div class="options" id="options"></div>

    </div>

  </div>


  <!-- =========================
       ターン結果
  ========================== -->

  <div class="card result" id="result">

    <div class="resultTitle" id="resultTitle"></div>

    <div class="resultText" id="resultText"></div>

    <button class="next" id="nextButton" onclick="nextTurn()">
      次へ →
    </button>

  </div>


  <!-- =========================
       最終結果
  ========================== -->

  <div class="card final" id="final">

    <h2>🏆 あなたの滞納対応力</h2>

    <div class="finalScore" id="finalScore"></div>

    <div class="finalBox">

      <div>
        支払日を引き出した回数：
        <b id="finalPayment"></b>
      </div>

      <div>
        無駄な質問：
        <b id="finalWaste"></b>回
      </div>

      <div>
        滞納者に振り回された回数：
        <b id="finalTrouble"></b>回
      </div>

    </div>

    <p id="finalText"></p>

    <button class="next" onclick="location.reload()">
      もう一度やる
    </button>

  </div>

</div>

false = 最終的には払わない

各人物は3ターン。

質問
A / B / C

good = 支払日を引き出すために有効
waste = 無駄な質問
bad = 話がそれる

/*
==================================================
ゲーム変数
==================================================
*/

let selectedCases=[];
let currentPerson=0;
let currentTurn=0;

let paymentCount=0;
let wasteCount=0;
let troubleCount=0;

let paymentThisPerson=false;
let personFailed=false;


/*
==================================================
シャッフル
==================================================
*/

function shuffle(arr){

  const copy=[...arr];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}


/*
==================================================
ゲーム開始

最低でも
crazy 1人
weird 1人
を必ず入れる。

残り3人はランダム。

==================================================
*/

function startGame(){

  const crazy=cases.filter(c=>c.type==="crazy");
  const weird=cases.filter(c=>c.type==="weird");
  const normal=cases.filter(c=>c.type==="normal");

  const firstCrazy=
    shuffle(crazy)[0];

  const firstWeird=
    shuffle(weird)[0];

  const remainingPool=[
    ...normal,
    ...weird.filter(c=>c!==firstWeird),
    ...crazy.filter(c=>c!==firstCrazy)
  ];

  selectedCases=[
    firstCrazy,
    firstWeird,
    ...shuffle(remainingPool).slice(0,3)
  ];

  selectedCases=shuffle(selectedCases);

  currentPerson=0;
  currentTurn=0;

  paymentCount=0;
  wasteCount=0;
  troubleCount=0;

  document.getElementById("start").style.display="none";
  document.getElementById("game").classList.remove("hidden");

  render();

}


/*
==================================================
表示
==================================================
*/

function render(){

  const c=selectedCases[currentPerson];
  const t=c.turns[currentTurn];

  document.getElementById("personCount").textContent=
    `滞納者 ${currentPerson+1} / 5`;

  document.getElementById("paymentCount").textContent=
    paymentCount;

  document.getElementById("progressBar").style.width=
    ((currentPerson*3+currentTurn+1)/15*100)+"%";

  document.getElementById("personName").textContent=
    c.name;

  let typeText="";

  if(c.type==="normal"){
    typeText="滞納者";
  }

  if(c.type==="weird"){
    typeText="滞納者";
  }

  if(c.type==="crazy"){
    typeText="滞納者";
  }

  document.getElementById("personMeta").innerHTML=
    `${typeText}<br><span class="badge">対応中</span>`;

  document.getElementById("personInfo").innerHTML=
    `
    <div>
      年齢
      <b>${c.age}</b>
    </div>

    <div>
      職業
      <b>${c.job}</b>
    </div>

    <div>
      家賃
      <b>${c.rent}</b>
    </div>

    <div>
      滞納
      <b>${c.arrears}</b>
    </div>
    `;

  document.getElementById("turn").textContent=
    `第${currentTurn+1}ターン / 3`;

  document.getElementById("quote").textContent=
    t.quote;

  const options=
    document.getElementById("options");

  options.innerHTML="";

  t.options.forEach((op,index)=>{

    const button=
      document.createElement("button");

    button.className="option";

    button.textContent=
      `${["A","B","C"][index]}　${op[0]}`;

    button.onclick=
      ()=>selectOption(op[1]);

    options.appendChild(button);

  });

  document.getElementById("result").style.display="none";

}


/*
==================================================
質問を選択
==================================================
*/

function selectOption(type){

  if(type==="waste"){

    wasteCount++;

    showResult(
      "😇 それ、今聞く必要ある？",
      "話は聞けましたが、支払日には近づきませんでした。"
    );

    return;
  }


  if(type==="bad"){

    troubleCount++;

    showResult(
      "🌀 話がそれました",
      "滞納者の話に付き合っているうちに、支払日の話から離れてしまいました。"
    );

    return;
  }


  if(type==="pay"){

    paymentThisPerson=true;
    paymentCount++;

    showResult(
      "🎯 支払日を引き出した！",
      "いい対応です。変な話をしていても、最後はちゃんと支払日を確認できました。"
    );

    return;
  }


  if(type==="payfalse"){

    personFailed=true;

    showResult(
      "😇 支払日を引き出せなかった…",
      "もっともらしい話や奇妙な言い訳に付き合うだけでは、支払日は決まりません。"
    );

    return;
  }


  if(type==="good"){

    showResult(
      "👍 いい質問！",
      "支払日に一歩近づきました。次のターンへ。"
    );

    return;
  }

}


/*
==================================================
結果表示
==================================================
*/

function showResult(title,text){

  document.getElementById("game").classList.add("hidden");

  document.getElementById("result").style.display="block";

  document.getElementById("resultTitle").textContent=
    title;

  document.getElementById("resultText").textContent=
    text;

  const button=
    document.getElementById("nextButton");

  button.textContent=
    "次へ →";

}


/*
==================================================
次へ
==================================================
*/

function nextTurn(){

  document.getElementById("result").style.display="none";

  /*
  支払日を引き出した
  */

  if(paymentThisPerson){

    finishPerson();

    return;
  }


  /*
  その人で3ターン終了
  */

  if(currentTurn>=2){

    if(!paymentThisPerson){

      troubleCount++;

    }

    finishPerson();

    return;
  }


  currentTurn++;

  document.getElementById("game").classList.remove("hidden");

  render();

}


/*
==================================================
人物終了
==================================================
*/

function finishPerson(){

  currentTurn=0;
  paymentThisPerson=false;
  personFailed=false;

  currentPerson++;

  if(currentPerson>=5){

    finishGame();

    return;
  }

  document.getElementById("game").classList.remove("hidden");

  render();

}


/*
==================================================
最終結果
==================================================
*/

function finishGame(){

  document.getElementById("game").classList.add("hidden");

  document.getElementById("result").style.display="none";

  document.getElementById("final").style.display="block";

  const score=
    paymentCount*20
    -wasteCount*2
    -troubleCount*5;

  const finalScore=
    Math.max(0,score);

  document.getElementById("finalScore").textContent=
    finalScore+"点";

  document.getElementById("finalPayment").textContent=
    paymentCount+"/5";

  document.getElementById("finalWaste").textContent=
    wasteCount;

  document.getElementById("finalTrouble").textContent=
    troubleCount;


  let text="";

  if(paymentCount===5 && wasteCount<=1){

    text=
      "完璧。言い訳を聞きながらも、ちゃんと支払日を引き出しています。";

  }else if(paymentCount>=4){

    text=
      "かなり優秀。変な入居者に当たっても、冷静に支払日の話へ戻せています。";

  }else if(paymentCount>=3){

    text=
      "なかなかの対応力。もう少しだけ、言い訳に付き合いすぎないことがポイントです。";

  }else if(paymentCount>=1){

    text=
      "滞納者の話を聞くことに一生懸命になりすぎています。管理会社はカウンセリングルームではありません。";

  }else{

    text=
      "……今日は滞納者に完敗です。電話を切ったあと、もう一度こちらから電話しましょう。";

  }

  document.getElementById("finalText").textContent=
    text;

}
